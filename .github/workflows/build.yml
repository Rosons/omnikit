name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build (NSIS)
        env:
          CARGO_TARGET_DIR: ./target
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build (app + dmg)
        env:
          CARGO_TARGET_DIR: ./target
        run: npx tauri build --bundles app,dmg
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-macos
          path: |
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
