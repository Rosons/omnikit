name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Frontend tests
        run: npm test
      # 配置了签名私钥时追加生成更新器产物(未配置则只出常规安装包,构建保持可用)
      - name: Build (NSIS)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles nsis --config src-tauri/tauri.updater.conf.json
          else
            npx tauri build --bundles nsis
          fi
      - name: Locate bundle files
        shell: bash
        run: find target src-tauri/target -type d -name bundle 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Upload updater signature
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OmniKit-windows-sig
          path: target/release/bundle/nsis/*.exe.sig
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Build (app + dmg)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            npx tauri build --bundles app,dmg --config src-tauri/tauri.updater.conf.json
          else
            npx tauri build --bundles app,dmg
          fi
      - name: Locate bundle files
        shell: bash
        run: find target src-tauri/target -type d -name bundle 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-macos
          # 只上传 dmg 本体;.app 目录会让 artifact 以 bundle/ 为根,且内部文件本就不发布
          path: target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Upload updater artifacts
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: OmniKit-macos-updater
          path: |
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.app.tar.gz.sig
          if-no-files-found: error

  # 两个平台都构建成功后,自动创建 Release 并附上全部安装包
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      # 有签名产物时组装更新器清单;应用内自动更新从这里拉版本信息
      - name: Build latest.json
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
        env:
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const version = process.env.REF_NAME.replace(/^v/, "");
            const names = fs.readdirSync("dist");
            const exe = names.find((f) => f.endsWith("-setup.exe"));
            const mac = names.find((f) => f.endsWith(".app.tar.gz"));
            const latest = {
              version,
              notes: "OmniKit " + version + "，更新详情见 Release 页面",
              pub_date: new Date().toISOString(),
              platforms: {},
            };
            if (exe) {
              latest.platforms["windows-x86_64"] = {
                signature: fs.readFileSync("dist/" + exe + ".sig", "utf8").trim(),
                url: "https://github.com/" + process.env.REPO + "/releases/download/" + process.env.REF_NAME + "/" + exe,
              };
            }
            if (mac) {
              latest.platforms["darwin-aarch64"] = {
                signature: fs.readFileSync("dist/" + mac + ".sig", "utf8").trim(),
                url: "https://github.com/" + process.env.REPO + "/releases/download/" + process.env.REF_NAME + "/" + mac,
              };
            }
            fs.writeFileSync("dist/latest.json", JSON.stringify(latest, null, 2));
            console.log("latest.json platforms:", JSON.stringify(Object.keys(latest.platforms)));
          '
      - name: Collect release files
        id: files
        shell: bash
        run: |
          {
            echo 'files<<FILES_EOF'
            find dist -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.app.tar.gz' -o -name '*.sig' -o -name 'latest.json' \) | sort
            echo 'FILES_EOF'
          } >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          # 只发布安装包/更新器产物本体(find 结果天然非空,exe 与 dmg 恒存在)
          files: ${{ steps.files.outputs.files }}
          fail_on_unmatched_files: true
