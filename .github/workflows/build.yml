name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build (NSIS)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: npx tauri build --bundles nsis
      - name: Locate bundle files
        shell: bash
        run: find target src-tauri/target -type d -name bundle 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build (app + dmg)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: npx tauri build --bundles app,dmg
      - name: Locate bundle files
        shell: bash
        run: find target src-tauri/target -type d -name bundle 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error
