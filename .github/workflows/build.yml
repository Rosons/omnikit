name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build (NSIS)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: npx tauri build --bundles nsis
      - name: Locate bundle files
        shell: bash
        run: find target src-tauri/target -type d -name bundle 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-windows
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend deps
        run: npm ci
      - name: Build (app + dmg)
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: npx tauri build --bundles app,dmg
      - name: Locate bundle files
        shell: bash
        run: find target src-tauri/target -type d -name bundle 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: OmniKit-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
          if-no-files-found: error

  # 两个平台都构建成功后,自动创建 Release 并附上全部安装包
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          # 只发布安装包本体,过滤 .app 包解压出的内部文件
          files: |
            dist/*.exe
            dist/*.dmg
          fail_on_unmatched_files: true
