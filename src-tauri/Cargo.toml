[package]
name = "omnikit"
version = "0.11.0"
edition = "2021"
description = "开发者个人工具箱"

[lib]
name = "omnikit_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
arboard = "3"
png = "0.17"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
walkdir = "2"
jwalk = "0.8"
notify = "6"
tokio = { version = "1", features = ["time"] }
zeroize = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
encoding_rs = "0.8"
csv = "1"
sysinfo = "0.33"
ureq = "2"
trash = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
